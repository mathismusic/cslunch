# Slack app manifest — paste this at https://api.slack.com/apps
# ("Create New App" → "From a manifest") to create the bot in one step.
display_information:
  name: Lunch Train
  description: Daily lunch coordination for CS grad students. All aboard.
  background_color: "#d97706"
features:
  bot_user:
    display_name: lunch-train
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - reactions:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
