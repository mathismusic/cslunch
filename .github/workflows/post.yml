name: Post lunch call

on:
  schedule:
    # 11:00 America/Chicago. GitHub cron is UTC and ignores DST, so we fire at
    # both candidate hours; bot.py exits instantly on the one that isn't 11am.
    - cron: "0 16,17 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Open today's lunch issue
        run: python3 scripts/bot.py post
        env:
          # With a LUNCH_TOKEN secret (a PAT), the Slack card shows that
          # account as the issue author instead of github-actions[bot].
          GITHUB_TOKEN: ${{ secrets.LUNCH_TOKEN || github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
