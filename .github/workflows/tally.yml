name: Post headcount tally

on:
  schedule:
    # 11:45 America/Chicago; same double-firing DST trick as post.yml.
    - cron: "45 16,17 * * 1-5"
  workflow_dispatch:

jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tally reactions and announce
        run: python3 scripts/bot.py tally
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
